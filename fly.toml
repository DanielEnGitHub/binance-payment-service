app = "vega-binance-payment-service"
primary_region = "fra"

[deploy]
  strategy = "rolling"

[build]
  dockerfile = "Dockerfile"

[env]
  BINANCE_BASE_URL = "https://api.binance.com"
  ENVIRONMENT = "production"
  PORT = "8080"

[http_service]
  auto_start_machines = true
  auto_stop_machines = false
  force_https = true
  internal_port = 8080
  min_machines_running = 1

  [[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
